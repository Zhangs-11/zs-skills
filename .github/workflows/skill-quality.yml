name: Skill repository quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skill-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install validator dependency
        run: python -m pip install -r scripts/requirements-ci.txt

      - name: Test repository validator and revision analyzer
        run: python -m unittest discover -s scripts/tests && python -m unittest discover -s kakarot-writer/tests

      - name: Validate all Skills, evals, links and tracked secrets
        run: python scripts/validate_repo.py
